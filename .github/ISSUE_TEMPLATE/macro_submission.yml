name: Macro Submission
description: Submit a macro to be added to the library
title: "[Macro]: "
labels: ["macro-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit a Macro
        Please fill out the form below.
        After submitting, **attach your `.json` macro file** to the issue.

  - type: input
    id: name
    attributes:
      label: Macro Name
      placeholder: "My Cool Macro"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "What does this macro do?"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Attach your macro file
        After creating this issue, drag and drop your `.json` file into the comment box below ⬇️
