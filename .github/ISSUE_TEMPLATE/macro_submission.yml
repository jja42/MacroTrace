name: Macro Submission
description: Submit a Macro to be added to the library
title: "[Macro Upload]: (Add Title Here)"
labels: ["macro-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit a Macro
        Please fill out the form below.
        After submitting, **attach your `.json` macro file** to the issue.

  - type: input
    id: name
    attributes:
      label: Macro Name
      description: A short, descriptive name for your macro
      placeholder: "Type 'Hello World'"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What does this macro do?
      placeholder: "Types 'HELLO' using Shift + letters"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes (optional)
      description: Anything else users should know?
      placeholder: "Works best in text editors"

  - type: markdown
    attributes:
      value: |
        ### Attach your macro file
        After creating this issue, drag and drop your `.json` file into the comment box or click the button above to select and attach it
