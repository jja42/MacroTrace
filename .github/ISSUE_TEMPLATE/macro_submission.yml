name: Macro Submission
description: Submit a Macro to be added to the library. Do Not Remove [Macro Upload] From Title
title: "[Macro Upload]: (Add Title Here)"
labels: ["macro-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit a Macro
        Please fill out the form below.
        Don't forget to **attach your `.json` macro file** to this issue.

  - type: input
    id: name
    attributes:
      label: Macro Name
      description: A short, descriptive name for your macro
      placeholder: "Type 'Hello World'"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What does this macro do?
      placeholder: "Types 'HELLO' using Shift + letters"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Attach your macro file
        Don't forget to drag and drop your `.json` file into the comment box or click the button above to select and attach it
