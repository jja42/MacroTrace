name: Macro Submission
description: Submit a macro to be added to the library
title: "[Macro]: "
labels: ["macro-submission"]
body:
  - type: input
    id: name
    attributes:
      label: Macro Name
      placeholder: "My Cool Macro"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "What does this macro do?"
    validations:
      required: true

  - type: file
    id: macro_file
    attributes:
      label: Macro JSON File
      accept: ".json"
    validations:
      required: true