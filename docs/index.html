<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Macro Library</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #111;
      color: #eee;
    }

    h1 {
      margin-bottom: 0.2em;
    }

    p {
      color: #aaa;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 8px 0;
    }

    a, button {
      color: #6cf;
      text-decoration: none;
      background: none;
      border: 2px solid #6cf;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 12px;
      display: inline-block;
    }

    a:hover, button:hover {
      background-color: #6cf;
      color: #111;
    }

    .divider {
      border-top: 2px solid #444;
      margin: 20px 0;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9em;
      color: #777;
    }

    .description {
      color: #aaa;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <h1>Macro Library</h1>
  <p>Download and share input macros.</p>

  <!-- Upload button -->
<button
  onclick="window.location.href='https://github.com/jja42/MacroTrace/issues/new?template=macro_submission.yml'">
  Submit a Macro
</button>

  <!-- Divider -->
  <div class="divider"></div>

  <h3>Macro List</h3>

  <!-- Macro list -->
  <ul id="macro-list">
    <li>Loading…</li>
  </ul>

  <div class="footer">
    Hosted on GitHub Pages
  </div>

  <script>
    fetch("macros/index.json")
      .then(r => {
        if (!r.ok) throw new Error("Failed to load index.json");
        return r.json();
      })
      .then(macros => {
        const list = document.getElementById("macro-list");
        list.innerHTML = "";

        if (macros.length === 0) {
          list.innerHTML = "<li>No macros yet.</li>";
          return;
        }

        macros.forEach(m => {
          const li = document.createElement("li");

          // Download link instead of raw navigation
          const a = document.createElement("a");
          a.href = "macros/" + m.file;
          a.download = m.file; // forces download
          a.textContent = m.name;

          li.appendChild(a);

          // Description
          if (m.description) {
            const desc = document.createElement("span");
            desc.textContent = " – " + m.description;
            desc.className = "description";
            li.appendChild(desc);
          }

          list.appendChild(li);
        });
      })
      .catch(err => {
        document.getElementById("macro-list").innerHTML =
          "<li>Error loading macros.</li>";
        console.error(err);
      });
  </script>

</body>
</html>
